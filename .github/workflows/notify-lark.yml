name: Notify Lark on token update

on:
  push:
    branches:
      - "**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Lark notification
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$LARK_WEBHOOK_URL" ]; then
            echo "LARK_WEBHOOK_URL secret is not set — skipping notification."
            exit 0
          fi

          # A commit message can run to several paragraphs (rationale, test
          # notes, etc). This is a short heads-up sent to a busy shared group,
          # not a place for the full body — keep only the subject line.
          SUBJECT=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)

          TEXT=$(printf 'design_token diupdate oleh %s: %s\n%s' "$COMMIT_AUTHOR" "$SUBJECT" "$COMMIT_URL")

          # jq -nc builds a valid, compact JSON string, escaping quotes/newlines safely.
          PAYLOAD=$(jq -nc --arg text "$TEXT" '{msg_type: "text", content: {text: $text}}')

          curl -sS -X POST "$LARK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
